<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ATHENA State Machine</title>
<style>
:root{
  --bg:#0f0e0c;
  --panel:#1a1815;
  --border:#35322c;
  --text:#edeae4;
  --dim:#8f8b82;
  --accent:#f0a63c;
  --accent2:#ff5d5d;
  --ease:cubic-bezier(.2,.8,.2,1);
  --bp1:rgba(240,166,60,.78);
  --bp2:rgba(240,166,60,.55);
  --bp3:rgba(240,166,60,.34);
  --bp4:rgba(240,166,60,.2);

  --speed:1;

  --count-dur:3400ms;
  --line-in:.75s;
  --rule-in:1.2s;

  --pop:cubic-bezier(.34,1.56,.64,1);
  --out:ease-out;

  --node-in:.8s;
  --wire-in:.9s;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:"Barlow Condensed","Oswald","Archivo Narrow","Segoe UI",system-ui,sans-serif;
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  cursor:none;
}

.stage{
  position:relative;
  width:1920px;height:1080px;
  background:var(--bg);
  overflow:hidden;
  flex:none;
  transform-origin:center center;
}

.grid{
  position:absolute;inset:0;
  background-image:
    linear-gradient(to right,rgba(240,166,60,.075) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(240,166,60,.075) 1px,transparent 1px),
    linear-gradient(to right,rgba(240,166,60,.032) 1px,transparent 1px),
    linear-gradient(to bottom,rgba(240,166,60,.032) 1px,transparent 1px);
  background-size:240px 240px,240px 240px,48px 48px,48px 48px;
  pointer-events:none;
}
.warmth{
  position:absolute;inset:0;
  background:radial-gradient(ellipse 62% 50% at 50% 44%,rgba(240,166,60,.055),transparent 70%);
  pointer-events:none;
}
.corner{position:absolute;width:30px;height:30px;opacity:.9}
.corner.tl{left:44px;top:44px;border-left:2px solid var(--border);border-top:2px solid var(--border)}
.corner.tr{right:44px;top:44px;border-right:2px solid var(--border);border-top:2px solid var(--border)}
.corner.bl{left:44px;bottom:44px;border-left:2px solid var(--border);border-bottom:2px solid var(--border)}
.corner.br{right:44px;bottom:44px;border-right:2px solid var(--border);border-bottom:2px solid var(--border)}

.zone{position:absolute}

.rv.pop{opacity:0;transform:translateY(16px) scale(.95)}
.rv.pop.on{animation:popin var(--node-in) var(--pop) var(--d,0s) forwards}
.rv.slide{opacity:0;transform:translateX(-26px)}
.rv.slide.on{animation:slidein var(--node-in) var(--ease) var(--d,0s) forwards}
.rv.fade{opacity:0}
.rv.fade.on{animation:fadein .7s var(--out) var(--d,0s) forwards}

.title{
  left:280px;top:28px;
  padding-left:22px;
  border-left:4px solid var(--accent);
  font-size:30px;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:var(--accent);
}
.title .sub{
  display:block;margin-top:4px;
  font-size:19px;letter-spacing:.3em;font-weight:500;color:var(--dim);
}

.flow{left:280px;top:130px;width:1360px;height:850px}
.flow svg{
  position:absolute;inset:0;
  width:1360px;height:850px;
  overflow:visible;
}

.wire{
  fill:none;
  stroke:var(--border);
  stroke-width:2;
  stroke-linecap:round;
  stroke-dasharray:var(--len);
  stroke-dashoffset:var(--len);
  opacity:0;
}
.wire.on{animation:draw var(--wire-in) var(--ease) var(--d,0s) forwards}
@keyframes draw{to{opacity:1;stroke-dashoffset:0}}

.wire.heat.on{
  animation:draw var(--wire-in) var(--ease) var(--d,0s) forwards,
            heat .6s var(--out) calc(var(--d,0s) + .7s) forwards;
}
@keyframes heat{
  from{stroke:var(--border);filter:none}
  to{stroke:var(--accent);filter:drop-shadow(0 0 8px rgba(240,166,60,.75))}
}

.wire.bad{
  stroke:var(--accent2);
  filter:drop-shadow(0 0 7px rgba(255,93,93,.55));
}

.pwrap{opacity:0}
.pwrap.on{opacity:1}
.pulse{
  fill:var(--accent);
  filter:drop-shadow(0 0 10px var(--accent)) drop-shadow(0 0 22px var(--accent));
  animation:pulseflash .55s linear infinite;
}
.pulse.badp{
  fill:var(--accent2);
  filter:drop-shadow(0 0 10px var(--accent2)) drop-shadow(0 0 22px var(--accent2));
}
@keyframes pulseflash{
  0%,100%{opacity:0}
  50%{opacity:1}
}

.node{
  position:absolute;
  display:flex;align-items:center;justify-content:center;
}

.pill{
  width:240px;height:72px;
  border:1.5px solid var(--accent);
  border-radius:36px;
  background:var(--panel);
  color:var(--accent);
  box-shadow:0 0 26px rgba(240,166,60,.12);
}
.pill span{
  font-size:23px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
}

.proc{
  width:300px;height:100px;
  border:1.5px solid var(--border);
  border-radius:4px;
  background:var(--panel);
  flex-direction:column;gap:5px;
}
.proc .lbl{
  font-size:24px;font-weight:600;letter-spacing:.13em;text-transform:uppercase;
}
.proc .note{
  font-size:15px;font-weight:500;letter-spacing:.08em;color:var(--dim);
  text-transform:none;
}
.proc::before{
  content:"";position:absolute;left:0;top:0;bottom:0;width:3px;
  background:var(--border);border-radius:4px 0 0 4px;
}
.proc.hot{border-color:var(--accent);box-shadow:0 0 34px rgba(240,166,60,.13)}
.proc.hot::before{background:var(--accent);filter:drop-shadow(0 0 8px var(--accent))}

.wake{
  width:240px;height:60px;
  border:1.5px solid var(--accent);
  border-radius:4px;
  background:var(--panel);
  color:var(--accent);
  font-size:19px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;
  box-shadow:0 0 24px rgba(240,166,60,.16);
}

.cancel{
  position:absolute;
  width:210px;height:62px;
  border:1.5px dashed var(--accent2);
  border-radius:4px;
  background:transparent;
  color:var(--accent2);
  font-size:17px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;
  display:flex;align-items:center;justify-content:center;
}

.diamond{
  position:absolute;
  width:190px;height:190px;
  left:585px;top:355px;
}
.diamond .face{
  position:absolute;inset:0;
  transform:rotate(45deg);
  border:1.5px solid var(--accent);
  background:var(--panel);
  box-shadow:0 0 30px rgba(240,166,60,.14);
  border-radius:6px;
}
.diamond .txt{
  position:absolute;inset:0;
  display:flex;align-items:center;justify-content:center;
  font-size:21px;font-weight:600;letter-spacing:.14em;
  text-transform:uppercase;color:var(--accent);
}

.tag{
  position:absolute;
  font-size:16px;font-weight:600;letter-spacing:.24em;
  text-transform:uppercase;
}
.tag.yes{color:var(--accent)}
.tag.no{color:var(--dim)}
.tag.red{color:var(--accent2)}

.bp{position:absolute;inset:0;pointer-events:none;z-index:0}
.bp .b{stroke:rgba(240,166,60,.42);stroke-width:1.5;stroke-dasharray:400;stroke-dashoffset:400;
  animation:bdraw 1.5s var(--ease) var(--bd,.2s) forwards}
.bp .b.dim{stroke:rgba(240,166,60,.24)}
.bp .b.thin{stroke-width:1}
.bp .b.hot{stroke:rgba(240,166,60,.72);stroke-width:2.5;stroke-dasharray:600;stroke-dashoffset:600;
  animation:bdraw 1.9s var(--ease) var(--bd,.35s) forwards}
.bp .dot{fill:var(--accent);opacity:0;animation:dotin .5s var(--out) var(--dd,1.1s) forwards}
.bp .txt{
  fill:rgba(240,166,60,.55);font-size:15px;letter-spacing:.2em;opacity:0;
  animation:fadein .7s var(--out) var(--td,1.35s) forwards;
}
.bp .txt.dim{fill:rgba(240,166,60,.32)}
.bp .txt.k{fill:rgba(240,166,60,.85);font-weight:600;letter-spacing:.26em}
.bp .lx{stroke:rgba(240,166,60,.2);stroke-width:1;stroke-dasharray:4 8;
  animation:spin 34s linear infinite;transform-origin:960px 540px}
.bp .pulse{fill:var(--accent);opacity:.18}
.bp .pulse.r{animation:ping 4.6s var(--out) 2s infinite}
.bp .pulse.r2{animation:ping 4.6s var(--out) 4.1s infinite}
@keyframes bdraw{to{stroke-dashoffset:0}}
@keyframes dotin{to{opacity:1}}
@keyframes ping{0%{opacity:.2;r:38}70%{opacity:0;r:150}100%{opacity:0;r:150}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes popin{to{opacity:1;transform:translateY(0) scale(1)}}
@keyframes slidein{to{opacity:1;transform:translateX(0)}}
</style>
<style>
:root{
  --ease:cubic-bezier(.22,1,.36,1);
  --pop:cubic-bezier(.34,1.56,.64,1);
  --out:cubic-bezier(.33,1,.68,1);

  --node-in:1.15s;
  --wire-in:1.4s;

  --bp1:rgba(240,166,60,.78);
  --bp2:rgba(240,166,60,.55);
  --bp3:rgba(240,166,60,.34);
  --bp4:rgba(240,166,60,.2);

  --speed:1;

  --count-dur:3400ms;
  --line-in:.75s;
  --rule-in:1.2s;
}

*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:var(--bg)}
body{
  font-family:"Barlow Condensed","Oswald","Archivo Narrow","Segoe UI",system-ui,sans-serif;
  color:var(--text);
  display:flex;align-items:center;justify-content:center;
  cursor:none;
}

.stage{
  position:relative;
  width:1920px;height:1080px;
  background:var(--bg);
  overflow:hidden;
  flex:none;
  transform-origin:center center;
}

.bpLayer{
  position:absolute;inset:0;width:1920px;height:1080px;
  overflow:visible;pointer-events:none;z-index:1;
  animation:camdrift 26s ease-in-out infinite alternate;
}
.layer{position:absolute;inset:0;pointer-events:none}

  background-image:

    linear-gradient(to right,rgba(240,166,60,.032) 1px,transparent 1px),

  background-size:240px 240px,240px 240px,48px 48px,48px 48px;
}
.warmth{
  background:radial-gradient(ellipse 62% 50% at 50% 44%,rgba(240,166,60,.055),transparent 70%);
}
.vig{
  background:radial-gradient(ellipse 118% 90% at 50% 46%,transparent 52%,rgba(0,0,0,.3) 82%,rgba(0,0,0,.5) 100%);
}
.scan{
  background:repeating-linear-gradient(to bottom,rgba(255,255,255,.02) 0 1px,transparent 1px 4px);
  opacity:.45;
  animation:scanroll 7s linear infinite;
}
@keyframes scanroll{to{transform:translateY(4px)}}
.corner{position:absolute;width:30px;height:30px;opacity:.9;pointer-events:none}
.corner.tl{left:44px;top:44px;border-left:2px solid var(--border);border-top:2px solid var(--border)}
.corner.tr{right:44px;top:44px;border-right:2px solid var(--border);border-top:2px solid var(--border)}
.corner.bl{left:44px;bottom:44px;border-left:2px solid var(--border);border-bottom:2px solid var(--border)}
.corner.br{right:44px;bottom:44px;border-right:2px solid var(--border);border-bottom:2px solid var(--border)}

.zone{position:absolute}

.rv.pop{
  opacity:0;
  transform:perspective(1200px) translateY(34px) translateZ(-140px) rotateX(12deg) scale(.93);
}
.rv.pop.on{animation:popin 1.6s var(--ease) var(--d,0s) forwards}
.rv.slide{
  opacity:0;
  transform:perspective(1200px) translateX(-58px) rotateY(15deg);
}
.rv.slide.on{animation:slidein 1.4s var(--ease) var(--d,0s) forwards}
.rv.fade{opacity:0}
.rv.fade.on{animation:fadein 1.25s var(--out) var(--d,0s) forwards}

.title{
  left:280px;top:28px;
  padding-left:22px;
  border-left:4px solid var(--accent);
  font-size:30px;font-weight:600;letter-spacing:.22em;
  text-transform:uppercase;color:var(--accent);
  animation:tflick 9s steps(1,end) 1.4s infinite;
}
.title .sub{
  display:block;margin-top:4px;
  font-size:19px;letter-spacing:.3em;font-weight:500;color:var(--dim);
}
@keyframes tflick{0%,96%{opacity:1}96.5%,97.2%{opacity:.55}97.4%,100%{opacity:1}}

@keyframes popin{
  0%{opacity:0;transform:perspective(1200px) translateY(30px) translateZ(-140px) rotateX(10deg) scale(.94)}
  55%{opacity:1;transform:perspective(1200px) translateY(-4px) translateZ(9px) rotateX(-1.2deg) scale(1.008)}
  80%{transform:perspective(1200px) translateY(2px) translateZ(-3px) rotateX(.4deg) scale(.998)}
  100%{opacity:1;transform:perspective(1200px) translateY(0) translateZ(0) rotateX(0deg) scale(1)}
}
@keyframes slidein{
  0%{opacity:0;transform:perspective(1200px) translateX(-52px) rotateY(13deg)}
  70%{opacity:1;transform:perspective(1200px) translateX(4px) rotateY(-1deg)}
  100%{opacity:1;transform:perspective(1200px) translateX(0) rotateY(0deg)}
}
@keyframes fadein{to{opacity:1}}
@keyframes camdrift{
  0%{transform:perspective(1600px) rotateY(-1.25deg) rotateX(.5deg) scale(1.05)}
  100%{transform:perspective(1600px) rotateY(1.25deg) rotateX(-.6deg) scale(1.05)}
}

.hair{stroke:var(--bp3);stroke-width:1;fill:none}
.wash{fill:url(#hatch)}
.ink{fill:none;stroke:var(--accent);stroke-width:1.4;stroke-linecap:round;stroke-linejoin:round;
  stroke-dasharray:var(--l,800);stroke-dashoffset:var(--l,800);
  animation:bdraw calc(var(--sd,1.1s)/var(--speed)) var(--ease) var(--bd,0s) forwards}
.ink.dt{stroke:var(--bp2);stroke-width:1}
.ink.hot{stroke-width:1.7;filter:drop-shadow(0 0 5px rgba(240,166,60,.55))}
.ink.x{stroke:var(--accent2);stroke-width:1.5;filter:drop-shadow(0 0 6px rgba(255,93,93,.5))}
.ink.faint{stroke:var(--bp3)}
.bpdot{fill:var(--accent);opacity:0;animation:dotin .5s var(--out) var(--dd,1.2s) forwards}
.tn{fill:var(--bp2);font-size:14px;letter-spacing:.28em;opacity:0;animation:dotin .7s var(--out) var(--td,1.6s) forwards}
.tn.k{fill:var(--accent);font-weight:600;letter-spacing:.34em}
.tn.dim{fill:var(--bp3)}
.fx{opacity:0;animation:dotin .8s var(--out) var(--td,1.8s) forwards}
.pop.on.hl{animation:hit .5s var(--pop) var(--d,0s) forwards}
@keyframes hit{0%{transform:scale(1)}35%{transform:scale(1.035)}100%{transform:scale(1)}}
@keyframes bdraw{to{stroke-dashoffset:0}}
@keyframes dotin{to{opacity:1}}
@keyframes flick{0%,100%{opacity:1}48%{opacity:.45}52%{opacity:1}}
.bpf{fill:none;stroke:var(--accent)}

.row.on .bar{animation-duration:2.6s}
.row.on .val{
  animation-name:valflip;
  animation-duration:.9s;
  animation-delay:2.85s;
  animation-fill-mode:forwards;
  animation-timing-function:var(--out);
}
@keyframes valflip{
  0%{opacity:0;transform:translateY(-50%) perspective(900px) rotateX(72deg) translateZ(-34px)}
  100%{opacity:1;transform:translateY(-50%) perspective(900px) rotateX(0deg) translateZ(0)}
}
.bc{fill:none;stroke-width:2.4;stroke-linecap:round}
.bc.c1{stroke:var(--bp2)}
.bc.c2{stroke:var(--bp3)}
.bc.c3{stroke:var(--bp4)}
.bc.hot{stroke:var(--accent);opacity:.85}
.bcs{stroke-width:1.3}
.bd{fill:none;stroke:var(--bp4);stroke-width:1.3;stroke-linecap:round;stroke-dasharray:1 6}
.sd{opacity:0}
.sd.s1{animation:flick 4.2s steps(1,end) .8s infinite}
.sd.s2{animation:flick 6.8s steps(1,end) 2.1s infinite}
.sd.s3{animation:flick 9.5s steps(1,end) .2s infinite}
.co{fill:none;stroke:var(--bp1);stroke-width:1.5}
.cl{fill:none;stroke:var(--bp2);stroke-width:1.3;stroke-dasharray:34 300;
  animation:clput 7s var(--out) var(--cd,1.6s) forwards}
.cn{fill:none;stroke:var(--bp3);stroke-width:1.3;stroke-dasharray:22 360;
  animation:clput 9s var(--out) var(--cd,1.1s) forwards}
.rev{opacity:0;animation:dotin .4s linear var(--rd,1.5s) forwards;
  stroke:var(--accent2);stroke-width:1.7;fill:none}
.sel{fill:rgba(240,166,60,.028);stroke:var(--bp4);stroke-width:1;stroke-dasharray:5 5}
.ts{fill:var(--accent2);opacity:0;animation:flick 6.2s steps(1,end) 1.4s infinite}
.tk{fill:var(--accent);opacity:0;animation:flick 5.4s steps(1,end) .7s infinite}
path.dl{stroke:var(--accent);stroke-width:2;stroke-dasharray:var(--l,10) var(--l,10);

.trc{fill:none;stroke:var(--accent2);stroke-width:1.5;stroke-dasharray:5 6;
  animation:flick 5.8s steps(1,end) 1s infinite}
@keyframes tdraw{to{stroke-dashoffset:0}}
@keyframes relive{0%,72%{opacity:1}76%{opacity:.25}82%{opacity:1}100%{opacity:1}}
@keyframes clput{to{stroke-dashoffset:334}}
@keyframes flick{0%,88%,100%{opacity:0}89%,96%{opacity:1}}
.msr{fill:none;stroke:var(--bp2);stroke-width:1.2}
.fin{fill:var(--accent)}
.dw{fill:none;stroke:var(--bp3);stroke-width:1;stroke-dasharray:8 7}
.gdot{fill:var(--accent);filter:drop-shadow(0 0 5px rgba(240,166,60,.75))}
.gdot.dim{fill:var(--bp2);filter:none}
.pring{fill:none;stroke:var(--accent);stroke-width:1.6;opacity:0;
  animation:pring 4.4s var(--out) 1.2s infinite}
.pring.d2{animation-delay:3.4s}
@keyframes pring{0%{opacity:.5;r:26}70%{opacity:0;r:132}100%{opacity:0;r:132}}
.gl{stroke:var(--accent);stroke-width:3;fill:none;stroke-linecap:round;opacity:.55;
  animation:glp 3.8s var(--out) var(--gd,0s) infinite}
.gl.dt{stroke:var(--bp2);stroke-width:1.5;animation-duration:5.2s}
@keyframes glp{0%{opacity:.5;stroke-width:3}50%{opacity:.1;stroke-width:9}100%{opacity:.5;stroke-width:3}}
.sbp{fill:none;stroke:var(--accent2);stroke-width:1.4;stroke-dasharray:4 7;stroke-linecap:round;
  animation:sbpflick 3.4s steps(1,end) 1s infinite}
@keyframes sbpflick{0%,86%,100%{opacity:.85}87%,94%{opacity:.15}}
.pk{fill:none;stroke:var(--accent);stroke-width:1.3;stroke-dasharray:3 6;stroke-linecap:round;

@keyframes stroll{to{stroke-dashoffset:-36}}

.sheen{fill:url(#shg)}
.flyp{animation:flyb calc(var(--sd,3s)/var(--speed)) linear var(--bd,.8s) infinite}

<script>
const TOTAL=10;
let step=0;
const groups=[...document.querySelectorAll('[data-s]')];

const stageEl=document.getElementById('stage');
let baseK=1,camOn=false,camZ=1,camTX=0,camTY=0;
const focusMap={};
function stageRect(el){
  let x=0,y=0,n=el;
  while(n&&n!==stageEl){x+=n.offsetLeft;y+=n.offsetTop;n=n.offsetParent;}
  return {x,y,w:el.offsetWidth,h:el.offsetHeight};
}
groups.forEach(g=>{
  const s=+g.dataset.s;if(!s)return;
  const r=stageRect(g);
  if(!r.w||!r.h)return;
  const f=focusMap[s]||(focusMap[s]={x1:1e9,y1:1e9,x2:-1e9,y2:-1e9});
  f.x1=Math.min(f.x1,r.x);f.y1=Math.min(f.y1,r.y);
  f.x2=Math.max(f.x2,r.x+r.w);f.y2=Math.max(f.y2,r.y+r.h);
});
function focusFor(s){
  const f=focusMap[s];if(!f)return null;
  const P=80;
  const x1=Math.max(0,f.x1-P),y1=Math.max(0,f.y1-P);
  const x2=Math.min(1920,f.x2+P),y2=Math.min(1080,f.y2+P);
  const z=Math.min(1920/(x2-x1),1080/(y2-y1),1.75);
  if(z<1.06)return null;
  return {z,tx:-(baseK*z)*((x1+x2)/2-960),ty:-(baseK*z)*((y1+y2)/2-540)};
}
function applyT(){
  if(camOn){stageEl.style.transform='translate('+camTX+'px,'+camTY+'px) scale('+(baseK*camZ)+')';}
  else{stageEl.style.transform='scale('+baseK+')';}
}
function camTo(f){camZ=f.z;camTX=f.tx;camTY=f.ty;camOn=true;applyT();}
function camOff(){camOn=false;camZ=1;camTX=0;camTY=0;applyT();}
function sync(){
  groups.forEach(g=>g.classList.toggle('on',+g.dataset.s<=step));
}
function next(){
  if(step<TOTAL){step++;sync();const f=focusFor(step);if(f)camTo(f);}
}
function reset(){
  step=0;sync();camOff();
}
addEventListener('keydown',e=>{
  if(e.key===' '||e.key==='ArrowRight'||e.key==='Enter'){e.preventDefault();next();}
  else if(e.key==='r'||e.key==='R'||e.key==='Backspace'){reset();}
});
addEventListener('mousedown',e=>{if(e.button===2){camOff();}else{next();}});
addEventListener('contextmenu',e=>e.preventDefault());

function fitStage(){
  baseK=Math.min(innerWidth/1920,innerHeight/1080);
  stageEl.style.transition='none';
  applyT();
  requestAnimationFrame(()=>{stageEl.style.transition='transform 1.8s cubic-bezier(.19,1,.22,1)';});
}
addEventListener('resize',fitStage);
fitStage();
sync();
window.go=n=>{step=n;sync();camOff();};
window.cam=v=>{const f=focusFor(step||1);if(v&&f)camTo(f);else camOff();};
</script>
