# ATHENA USB audio default. The USB device advertises the stable ALSA card ID
# "Device", with mono capture and stereo playback fixed at 48 kHz.
pcm.athena_usb_capture {
    type plug
    slave {
        pcm "hw:Device,0"
        format S16_LE
        rate 48000
        channels 1
    }
}

pcm.athena_usb_playback {
    type plug
    slave {
        pcm "hw:Device,0"
        format S16_LE
        rate 48000
        channels 2
    }
    route_policy duplicate
}

pcm.!default {
    type asym
    capture.pcm "athena_usb_capture"
    playback.pcm "athena_usb_playback"
}

ctl.!default {
    type hw
    card Device
}
