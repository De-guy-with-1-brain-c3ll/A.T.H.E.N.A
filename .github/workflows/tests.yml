name: Tests
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install . pytest
      # Browser, network, docker and ffmpeg tests guard themselves behind opt-in
      # env vars or skip when the tool is missing, so this needs no extra setup.
      - run: python -m pytest
